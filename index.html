<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Η Μάχη των Φαρσάλων (1897) - Εκπαιδευτική Παρουσίαση</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-color: #e45826;
            --dark-bg: #162447;
            --darker-bg: #1a1a2e;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--darker-bg) 0%, var(--dark-bg) 100%);
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }
        
        .card {
            background: linear-gradient(to bottom right, var(--dark-bg), var(--darker-bg));
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            border-left: 6px solid var(--accent-color);
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 80vh;
            max-height: 95vh;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(to right, var(--accent-color), #f17345);
        }
        
        .accent-text {
            color: var(--accent-color);
        }
        
        .accent-bg {
            background-color: var(--accent-color);
        }
        
        .main-button {
            transition: all 0.3s;
            background: linear-gradient(to right, var(--accent-color), #f17345);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            cursor: pointer;
            font-size: clamp(0.875rem, 2vw, 1rem);
        }
        
        .main-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }
        
        .main-button:active {
            transform: translateY(0);
        }
        
        .slide-content {
            transition: opacity 0.5s ease-in-out;
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .page-indicator {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: clamp(0.75rem, 2vw, 0.875rem);
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 1rem;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--accent-color), #f17345);
            transition: width 0.5s ease;
        }
        
        .timeline {
            position: relative;
            padding-left: 2rem;
            margin-top: 1.5rem;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent-color);
        }
        
        .timeline-item {
            position: relative;
            margin-bottom: 1.5rem;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -2.25rem;
            top: 0.5rem;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            border: 2px solid var(--dark-bg);
        }
        
        .highlight-box {
            background: rgba(228, 88, 38, 0.1);
            border-left: 4px solid var(--accent-color);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
        }
        
        /* Thumbnail styles - 50% size */
        .thumbnail-container {
            width: 50%;
            margin: 1.5rem auto;
            background-color: #0d1321;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            text-align: center;
            color: #aaa;
            font-style: italic;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .thumbnail-container:hover {
            transform: scale(1.05);
        }
        
        .thumbnail-container img {
            width: 100%;
            height: auto;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .thumbnail-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 0.5rem;
            font-size: clamp(0.75rem, 2vw, 0.875rem);
            color: white;
        }
        
        /* Profile image thumbnails */
        .profile-thumbnail {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-color);
            margin: 0 auto 0.5rem;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .profile-thumbnail:hover {
            transform: scale(1.1);
        }
        
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: clamp(0.75rem, 2vw, 1rem);
        }
        
        .comparison-table th {
            background-color: var(--accent-color);
            color: white;
            padding: 0.75rem;
            text-align: center;
        }
        
        .comparison-table td {
            padding: 0.75rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .comparison-table tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .key-fact {
            display: flex;
            align-items: center;
            margin: 1rem 0;
        }
        
        .key-fact-icon {
            background: var(--accent-color);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            flex-shrink: 0;
        }
        
        .quote {
            font-style: italic;
            border-left: 4px solid var(--accent-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: #d1d5db;
        }
        
        .map-container {
            position: relative;
            width: 100%;
            background: #0d1321;
            border-radius: 8px;
            overflow: hidden;
            margin: 1.5rem 0;
        }
        
        .map-point {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-color);
            transform: translate(-50%, -50%);
        }
        
        .map-point::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--accent-color);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }
        
        .figure-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
        }
        
        /* Modal for full-size images */
        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .image-modal.active {
            display: flex;
        }
        
        .modal-image {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .modal-caption {
            color: white;
            margin-top: 1rem;
            text-align: center;
            max-width: 80%;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .card {
                min-height: 85vh;
                max-height: 90vh;
            }
            
            .card-header {
                padding: 1rem;
            }
            
            .slide-content {
                padding: 0.5rem;
            }
            
            .footer-buttons {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .footer-buttons > div {
                width: 100%;
                justify-content: space-between;
            }
            
            .thumbnail-container {
                width: 80%;
            }
            
            .map-container {
                height: 200px;
            }
        }
        
        @media (min-width: 769px) and (max-width: 1200px) {
            .card {
                min-height: 82vh;
                max-height: 88vh;
            }
        }
        
        @media (min-width: 1201px) {
            .card {
                min-height: 80vh;
                max-height: 85vh;
            }
        }
        
        @media (orientation: portrait) and (max-height: 700px) {
            .card {
                min-height: 90vh;
                max-height: 95vh;
            }
            
            .card-header h1 {
                font-size: 1.5rem;
            }
        }
        
        @media (orientation: landscape) and (max-height: 500px) {
            .card {
                min-height: 95vh;
                max-height: 98vh;
            }
            
            .card-header {
                padding: 0.5rem 1rem;
            }
            
            .slide-content {
                padding: 0.5rem;
            }
            
            .thumbnail-container {
                width: 40%;
            }
        }
        
        /* 4K Screens */
        @media (min-width: 2000px) {
            .card {
                max-width: 1800px;
            }
            
            .card-header h1 {
                font-size: 3rem;
            }
            
            .slide-content {
                font-size: 1.5rem;
            }
            
            .main-button {
                font-size: 1.25rem;
                padding: 1rem 2rem;
            }
            
            .thumbnail-container {
                width: 40%;
            }
        }
        
        /* Smart TV optimizations */
        @media (min-width: 1920px) and (min-height: 1080px) {
            body {
                padding: 2rem;
            }
            
            .card {
                border-radius: 24px;
            }
            
            .card-header h1 {
                font-size: 2.5rem;
            }
            
            .slide-content {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

        ];

        let currentPage = 0;

        const mainTitle = document.getElementById('main-title');
        const slideContent = document.getElementById('slide-content');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageIndicator = document.getElementById('page-indicator');
        const footerPageIndicator = document.getElementById('footer-page-indicator');
        const progressFill = document.getElementById('progress-fill');
        const imageModal = document.getElementById('image-modal');
        const modalImage = document.getElementById('modal-image');
        const modalCaption = document.getElementById('modal-caption');
        const closeModal = document.querySelector('.close-modal');
        
        /**
         * Renders the content of the current slide.
         */
        function renderPage() {
            // Apply fade-out effect for transition
            slideContent.style.opacity = '0';

            setTimeout(() => {
                const slide = slides[currentPage];

                // Update the main title to include the slide title for clarity
                mainTitle.textContent = `Η Μάχη των Φαρσάλων (1897): ${slide.title}`;

                // Update content and apply fade-in effect
                slideContent.innerHTML = slide.content;
                slideContent.style.opacity = '1';

                // Update page indicators
                pageIndicator.textContent = `Σελίδα ${currentPage + 1} / ${slides.length}`;
                footerPageIndicator.textContent = `Σελίδα ${currentPage + 1} / ${slides.length}`;

                // Update progress bar
                const progressPercentage = ((currentPage + 1) / slides.length) * 100;
                progressFill.style.width = `${progressPercentage}%`;

                // Update button states
                prevBtn.disabled = currentPage === 0;
                prevBtn.classList.toggle('opacity-50', currentPage === 0);
                prevBtn.classList.toggle('cursor-not-allowed', currentPage === 0);
                
                nextBtn.disabled = currentPage === slides.length - 1;
                nextBtn.classList.toggle('opacity-50', currentPage === slides.length - 1);
                nextBtn.classList.toggle('cursor-not-allowed', currentPage === slides.length - 1);
                nextBtn.textContent = (currentPage === slides.length - 1) ? 'Τέλος' : 'Επόμενη →';

                // Add click event listeners to all thumbnails
                document.querySelectorAll('.thumbnail-container, .profile-thumbnail').forEach(thumbnail => {
                    thumbnail.addEventListener('click', openImageModal);
                });

            }, 250); // Delay matches the CSS transition time
        }

        /**
         * Changes the current page/slide.
         * @param {number} direction - 1 for next, -1 for previous.
         */
        function changePage(direction) {
            const newPage = currentPage + direction;
            if (newPage >= 0 && newPage < slides.length) {
                currentPage = newPage;
                renderPage();
            }
        }

        /**
         * Goes to a specific slide.
         * @param {number} slideIndex - The index of the slide to go to.
         */
        function goToSlide(slideIndex) {
            if (slideIndex >= 0 && slideIndex < slides.length) {
                currentPage = slideIndex;
                renderPage();
            }
        }

        /**
         * Opens the image modal with the clicked image
         * @param {Event} e - The click event
         */
        function openImageModal(e) {
            const container = e.currentTarget;
            const src = container.getAttribute('data-src');
            const caption = container.getAttribute('data-caption');
            
            modalImage.src = src;
            modalCaption.textContent = caption;
            imageModal.classList.add('active');
            
            // Prevent scrolling of background content
            document.body.style.overflow = 'hidden';
        }

        /**
         * Closes the image modal
         */
        function closeImageModal() {
            imageModal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                changePage(-1);
            } else if (e.key === 'ArrowRight') {
                changePage(1);
            } else if (e.key === 'Escape') {
                closeImageModal();
            }
        });

        // Close modal when clicking the X or outside the image
        closeModal.addEventListener('click', closeImageModal);
        imageModal.addEventListener('click', (e) => {
            if (e.target === imageModal) {
                closeImageModal();
            }
        });

        // Initialize the presentation on load
        document.addEventListener('DOMContentLoaded', () => {
            renderPage();
        });
    </script>

</body>
</html>
